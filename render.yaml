services:
  - type: web
    name: ticket-booking-backend
    env: node
    rootDir: backend
    plan: free
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ticket-booking-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1h
      - key: FRONTEND_URL
        sync: false
      - key: SEAT_HOLD_DURATION_MINUTES
        value: "10"
      - key: WAITLIST_OFFER_DURATION_MINUTES
        value: "15"

databases:
  - name: ticket-booking-db
    databaseName: ticketbooking
    user: ticketbooking_user
    plan: free
